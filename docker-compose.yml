services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hiraya_learning_center
      MYSQL_USER: hiraya
      MYSQL_PASSWORD: hiraya_hub
      MYSQL_ROOT_PASSWORD: hiraya_root
    ports:
      - "3306:3306"
    volumes:
      - hiraya-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uhiraya", "-phiraya_hub"]
      interval: 5s
      timeout: 5s
      retries: 20
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HIRAYA_MYSQL: mysql://hiraya:hiraya_hub@mysql:3306/hiraya_learning_center
      HIRAYA_SESSION_SECRET: change-this-long-random-string-before-public-deploy
      HIRAYA_PUBLIC_URL: https://www.hirayalearningcenter.app
      HIRAYA_CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:5173
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  hiraya-mysql:
