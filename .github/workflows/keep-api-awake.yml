name: Keep Hiraya API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Render API
        run: curl --fail --silent --show-error --max-time 90 "https://hiraya-play-center.onrender.com/api/health"
      - name: Wake website proxy
        run: curl --fail --silent --show-error --max-time 90 "https://www.hirayalearningcenter.app/api/health"
