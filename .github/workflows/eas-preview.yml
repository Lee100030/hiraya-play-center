# Owner-only. Do not commit EXPO_TOKEN.
name: eas-preview
on:
  workflow_dispatch:
    inputs:
      platform:
        description: android or ios
        default: android
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - working-directory: apps/mobile
        run: eas build --non-interactive --platform ${{ github.event.inputs.platform }} --profile preview
